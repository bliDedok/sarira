services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: sarira
      POSTGRES_USER: sarira
      POSTGRES_PASSWORD: sarira_dev_only
    ports:
      - "54322:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sarira -d sarira"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - sarira_postgres_data:/var/lib/postgresql/data

volumes:
  sarira_postgres_data:
